name: Hourly Haze Update

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Crucial: allows the bot to push the image back
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas seaborn matplotlib pytz

      - name: Run haze script
        run: python haze_script.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add haze_7d.png index.html
          git commit -m "Hourly haze update: $(date)" || echo "No changes to commit"
          git push
