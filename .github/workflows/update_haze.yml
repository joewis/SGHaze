name: Hourly Haze Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # Added for deployment trigger
      id-token: write    # Added for deployment trigger
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas seaborn matplotlib pytz

      - name: Run haze script
        run: python haze_script.py

      - name: Commit and push changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add haze_latest.png index.html
          git commit -m "Hourly haze update: $(date)" || echo "no_changes=true" >> $GITHUB_OUTPUT
          git push

      # This is the "magic" step that forces GitHub Pages to refresh the URL
      - name: Trigger GitHub Pages Rebuild
        if: steps.commit_step.outputs.no_changes != 'true'
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
