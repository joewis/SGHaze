name: Sync PM2.5 Data

on:
  schedule:
  - cron: '*/15 * * * *'  
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/checkout@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas pytz

      - name: Run Sync Script
        run: python fetch_pm25.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 1. Stage the new data/image so Git knows about them
          git add -f haze_latest.png index.html sg_haze.db

          # 2. "Stash" them temporarily to clear the workspace for the pull
          git stash

          # 3. Pull the latest from the server to get in sync
          git pull --rebase origin main

          # 4. Bring your changes back out of the stash
          git stash pop || echo "No stash to pop"

          # 5. Re-stage everything (just in case of conflicts)
          git add -f haze_latest.png index.html sg_haze.db

          # 6. Commit and Push
          git commit -m "Hourly haze update: $(date)" || echo "No changes to commit"
          git push origin main
          
          # 3. Commit only if there are actual changes
          git commit -m "Hourly haze update: $(date)" || echo "No changes to commit"
          
          # 4. Push back to main
          git push origin main
