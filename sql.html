<!DOCTYPE html>
<html>
<head>
    <title>SG Haze Heatmap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>
    <script src="app2.js" defer></script>
</head>
<body>
    <div class="card">
                <h1>&#x1F1F8;&#x1F1EC; SG Haze Heatmap</h1>
                <div class="legend">
                    <div class="item"><div class="dot" style="background:#228B22"></div>Good</div>
                    <div class="item"><div class="dot" style="background:#FFFF00"></div>Moderate</div>
                    <div class="item"><div class="dot" style="background:#FF0000"></div>Unhealthy</div>
                    <div class="item"><div class="dot" style="background:#800080"></div>Hazardous</div>
                </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>West</th>
                        <th>North</th>
                        <th>Central</th>
                        <th>South</th>
                        <th>East</th>
                    </tr>
                </thead>
                <tbody id="sql-output">
                    </tbody>
            </table>
        </div>
    </div>
    <div class="footer-fixed">
		<strong>Source:</strong> data.gov.sg API<br>
		<br>Generated via GitHub Actions
    </div>

</body>
</html>
