<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG PM2.5 Haze Heatmap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>

<body>
    <div class="card">
        <h1>🇸🇬 SG Haze Heatmap</h1>
        <div class="legend">
            <div class="item"><div class="dot" style="background:#228B22"></div>Good</div>
            <div class="item"><div class="dot" style="background:#FFFF00"></div>Moderate</div>
            <div class="item"><div class="dot" style="background:#FF8800"></div>Unhealthy</div>
            <div class="item"><div class="dot" style="background:#800080"></div>Hazardous</div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">Time</th>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">West</th>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">North</th>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">Central</th>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">South</th>
                        <th style="padding: 8px; background-color: #333; color: white; font-size: 0.75rem;">East</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be generated by app.js from the database -->
                </tbody>
            </table>
        </div>

    </div>

    <div class="footer-fixed">
        <strong>Source:</strong> data.gov.sg API<br>
        <strong>Data Freshness:</strong> Loading... (SGT)<br>
        Generated via GitHub Actions
    </div>

</body>
</html>
