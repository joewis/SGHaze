<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SG PM2.5 Haze Heatmap (Tabulator)</title>
    
    <link rel="stylesheet" href="styles.css">
    <link href="https://unpkg.com/tabulator-tables@6.4.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.4.0/dist/js/tabulator.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="card">
        <h1>&#x1F1F8;&#x1F1EC; SG Haze Heatmap</h1>
        
        <div class="legend">
            <div class="item"><div class="dot" style="background:#228B22"></div>Good</div>
            <div class="item"><div class="dot" style="background:#FFFF00"></div>Moderate</div>
            <div class="item"><div class="dot" style="background:#FF8800"></div>Unhealthy</div>
            <div class="item"><div class="dot" style="background:#800080"></div>Hazardous</div>
        </div>

        <div class="table-container">
            <div id="haze-table"></div>
        </div>
    </div>

    <div class="footer-fixed">
        <strong>Source:</strong> data.gov.sg API<br>
        Generated via sql.js & Tabulator
    </div>
</body>
</html>
